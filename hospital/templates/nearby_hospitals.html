<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carely - Nearby Hospitals</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root{
    --teal-900:#0b3d3a;
    --teal-700:#0e6b64;
    --teal-500:#12958a;
    --teal-100:#e3f6f3;
    --mint-bg:#f2faf8;
    --text-dark:#0f2b28;
    --text-mid:#5a6b69;
    --text-light:#93a3a1;
    --yellow:#ffb43a;
    --blue:#3b82f6;
    --shadow-soft:0 8px 24px rgba(15,43,40,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:#dfe9e7;
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }

  .phone{
    width:375px;
    background:var(--mint-bg);
    border-radius:40px;
    box-shadow:0 30px 60px rgba(0,0,0,0.25);
    overflow:hidden;
    border:10px solid #0f2b28;
    display:flex;
    flex-direction:column;
    height:812px;
  }

  .status-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px 4px;font-size:13px;font-weight:600;color:var(--text-dark);
    flex-shrink:0;
  }
  .status-icons{display:flex;align-items:center;gap:5px;font-size:14px;}

  .page-header{
    display:flex;align-items:center;gap:14px;padding:10px 20px 12px;
    flex-shrink:0;
  }
  .back-btn{
    width:34px;height:34px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-soft);color:var(--text-dark);font-size:15px;
    flex-shrink:0;
  }
  .page-header h1{
    font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;
    color:var(--text-dark);margin:0;flex:1;
  }
  .filter-toggle{color:var(--text-mid);font-size:17px;}

  .search-wrap{
    margin:0 20px 12px;display:flex;align-items:center;background:#fff;
    border-radius:14px;padding:11px 14px;box-shadow:var(--shadow-soft);gap:10px;
    flex-shrink:0;
  }
  .search-wrap i{color:var(--teal-500);font-size:15px;}
  .search-wrap input{
    border:none;outline:none;flex:1;font-size:13px;color:var(--text-dark);
    background:transparent;font-family:'Inter',sans-serif;
  }
  .search-wrap input::placeholder{color:var(--text-light);}

  .filter-row{
    display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;flex-shrink:0;
    scrollbar-width:none;
  }
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{
    border:1.5px solid #d8e6e3;background:#fff;border-radius:20px;
    padding:6px 14px;font-size:12px;font-weight:600;color:var(--text-mid);
    white-space:nowrap;cursor:pointer;transition:all .15s;
  }
  .filter-chip.active{background:var(--teal-700);color:#fff;border-color:var(--teal-700);}

  .map-wrap{position:relative;margin:0 20px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-soft);flex-shrink:0;}
  #hospital-map{width:100%;height:190px;background:#dbe9e6;}
  .locate-btn{
    position:absolute;bottom:10px;right:10px;z-index:500;
    width:36px;height:36px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);border:none;color:var(--teal-700);font-size:16px;
  }
  .map-status{
    position:absolute;top:10px;left:10px;z-index:500;background:rgba(255,255,255,0.95);
    padding:5px 10px;border-radius:10px;font-size:10.5px;font-weight:600;color:var(--text-mid);
    display:flex;align-items:center;gap:5px;
  }
  .map-status .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);}

  .result-count{padding:14px 20px 6px;font-weight:700;font-size:14px;color:var(--text-dark);flex-shrink:0;}

  .hosp-list{flex:1;overflow-y:auto;padding:0 20px 14px;}
  .hosp-card{
    background:#fff;border-radius:16px;padding:12px;display:flex;align-items:center;
    gap:12px;box-shadow:var(--shadow-soft);margin-bottom:10px;cursor:pointer;
  }
  .hosp-thumb{
    width:52px;height:52px;border-radius:12px;background:var(--teal-100);
    display:flex;align-items:center;justify-content:center;color:var(--teal-500);
    font-size:20px;flex-shrink:0;
  }
  .hosp-info{flex:1;min-width:0;}
  .hosp-info h4{margin:0 0 2px;font-size:13.5px;font-weight:700;color:var(--text-dark);}
  .hosp-info p{margin:0 0 2px;font-size:11.5px;color:var(--text-mid);}
  .hosp-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-mid);font-weight:500;}
  .hosp-meta .rating{display:flex;align-items:center;gap:3px;color:var(--text-dark);font-weight:700;}
  .hosp-meta .rating i{color:var(--yellow);font-size:11px;}
  .hosp-meta .open{color:var(--teal-500);font-weight:700;}
  .hosp-arrow{color:var(--text-light);font-size:14px;flex-shrink:0;}

  .bottom-nav{
    display:flex;justify-content:space-around;align-items:center;background:#fff;
    padding:10px 6px 14px;box-shadow:0 -4px 16px rgba(0,0,0,0.06);flex-shrink:0;
  }
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-light);font-size:9.5px;font-weight:600;}
  .nav-item i{font-size:18px;}
  .nav-item.active{color:var(--teal-500);}
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <i class="bi bi-reception-4"></i>
      <i class="bi bi-wifi"></i>
      <i class="bi bi-battery-full"></i>
    </div>
  </div>

  <div class="page-header">
    <div class="back-btn"><i class="bi bi-arrow-left"></i></div>
    <h1>Nearby Hospitals</h1>
    <i class="bi bi-sliders filter-toggle"></i>
  </div>

  <div class="search-wrap">
    <i class="bi bi-search"></i>
    <input type="text" id="search-input" placeholder="Search hospitals or specialty">
  </div>

  <div class="filter-row">
    <div class="filter-chip active" data-filter="nearby">Nearby</div>
    <div class="filter-chip" data-filter="top_rated">Top Rated</div>
    <div class="filter-chip" data-filter="24x7">24x7</div>
    <div class="filter-chip" data-filter="emergency">Emergency</div>
  </div>

  <div class="map-wrap">
    <div class="map-status"><span class="dot"></span><span id="map-status-text">Locating you…</span></div>
    <div id="hospital-map"></div>
    <button class="locate-btn" id="recenter-btn" title="Recenter on me"><i class="bi bi-crosshair"></i></button>
  </div>

  <div class="result-count" id="result-count">Finding hospitals…</div>

  <div class="hosp-list" id="hosp-list"></div>

  <div class="bottom-nav">
    <div class="nav-item active"><i class="bi bi-house-door-fill"></i>Home</div>
    <div class="nav-item"><i class="bi bi-hospital"></i>Hospitals</div>
    <div class="nav-item"><i class="bi bi-capsule"></i>Medicines</div>
    <div class="nav-item"><i class="bi bi-bank"></i>Schemes</div>
    <div class="nav-item"><i class="bi bi-person"></i>Profile</div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ===================================================================
  // No hospital lat/lng in the DB yet, so this demo:
  // 1. Gets the REAL user location live via the browser (blue dot, updates
  //    as you move, just like Google Maps).
  // 2. Places hospital pins at small random offsets AROUND that real
  //    location, so the map looks and behaves like a real "nearby
  //    hospitals" screen without needing coordinates in your database.
  //
  // Once you add latitude/longitude to your Hospital model, replace the
  // HOSPITALS array below with data fetched from your Django API
  // (see hospital_locations_api from earlier) and delete generateFakeHospitals().
  // ===================================================================

  const HOSPITAL_NAMES = [
    { name: "Apollo Care Hospital", specialty: "Multi-speciality", rating: 4.8, reviews: 1240, open24x7: true },
    { name: "City Health Center",   specialty: "General Hospital", rating: 4.6, reviews: 908,  open24x7: false },
    { name: "LifeSpring Medical",   specialty: "Super Speciality",  rating: 4.7, reviews: 760,  open24x7: true },
    { name: "Sunrise Nursing Home", specialty: "Maternity & Child", rating: 4.4, reviews: 512,  open24x7: false },
    { name: "Wockhardt Hospital",   specialty: "Multi-speciality", rating: 4.5, reviews: 1035,  open24x7: true }
  ];

  const NAGPUR_FALLBACK = [21.1458, 79.0882];

  const map = L.map('hospital-map', { zoomControl: false, attributionControl: false })
    .setView(NAGPUR_FALLBACK, 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const hospitalIcon = L.divIcon({
    className: '',
    html: `<div style="background:#0e6b64;width:26px;height:26px;border-radius:50% 50% 50% 0;
           transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;
           box-shadow:0 2px 6px rgba(0,0,0,0.3);">
           <i class="bi bi-hospital" style="transform:rotate(45deg);color:#fff;font-size:11px;"></i></div>`,
    iconSize: [26, 26],
    iconAnchor: [13, 26]
  });

  let userMarker = null;
  let accuracyCircle = null;
  const hospitalMarkers = [];

  // meters-to-degrees offset so pins land ~300m-1.5km from the user
  function randomOffset() {
    const meters = 300 + Math.random() * 1200;
    const angle = Math.random() * 2 * Math.PI;
    const dLat = (meters * Math.cos(angle)) / 111320;
    const dLng = (meters * Math.sin(angle)) / (111320 * Math.cos(angle * 0));
    return [dLat, meters * Math.sin(angle) / (111320 * 0.92)];
  }

  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function generateFakeHospitals(centerLat, centerLng) {
    return HOSPITAL_NAMES.map(h => {
      const [dLat, dLng] = randomOffset();
      const lat = centerLat + dLat;
      const lng = centerLng + dLng;
      return { ...h, lat, lng, distanceKm: haversineKm(centerLat, centerLng, lat, lng) };
    }).sort((a, b) => a.distanceKm - b.distanceKm);
  }

  function renderHospitals(list) {
    hospitalMarkers.forEach(m => map.removeLayer(m));
    hospitalMarkers.length = 0;

    const listEl = document.getElementById('hosp-list');
    listEl.innerHTML = '';
    document.getElementById('result-count').textContent = `${list.length} Hospitals Found`;

    list.forEach(h => {
      const marker = L.marker([h.lat, h.lng], { icon: hospitalIcon })
        .addTo(map)
        .bindPopup(`<b>${h.name}</b><br>${h.specialty} · ⭐ ${h.rating}`);
      hospitalMarkers.push(marker);

      const card = document.createElement('div');
      card.className = 'hosp-card';
      card.innerHTML = `
        <div class="hosp-thumb"><i class="bi bi-hospital"></i></div>
        <div class="hosp-info">
          <h4>${h.name}</h4>
          <p>${h.specialty} · ${h.distanceKm.toFixed(1)} km</p>
          <div class="hosp-meta">
            <span class="rating"><i class="bi bi-star-fill"></i>${h.rating} (${h.reviews})</span>
            ${h.open24x7 ? '<span class="open">Open 24x7</span>' : '<span>Closed now</span>'}
          </div>
        </div>
        <i class="bi bi-chevron-right hosp-arrow"></i>`;
      card.addEventListener('click', () => map.setView([h.lat, h.lng], 16));
      listEl.appendChild(card);
    });
  }

  // ---- Real live geolocation (blue dot tracks actual movement) ----
  function onLocationUpdate(pos) {
    const { latitude, longitude, accuracy } = pos.coords;
    const latlng = [latitude, longitude];
    document.getElementById('map-status-text').textContent = 'Live location';

    if (!userMarker) {
      userMarker = L.circleMarker(latlng, { radius: 8, fillColor: '#3b82f6', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
      map.setView(latlng, 15);
      renderHospitals(generateFakeHospitals(latitude, longitude));
    } else {
      userMarker.setLatLng(latlng);
    }

    if (!accuracyCircle) {
      accuracyCircle = L.circle(latlng, { radius: accuracy, color: '#3b82f6', weight: 0, fillOpacity: 0.15 }).addTo(map);
    } else {
      accuracyCircle.setLatLng(latlng).setRadius(accuracy);
    }
  }

  function onLocationError(err) {
    document.getElementById('map-status-text').textContent = 'Location unavailable';
    console.warn('Geolocation error:', err.message);
    renderHospitals(generateFakeHospitals(NAGPUR_FALLBACK[0], NAGPUR_FALLBACK[1]));
  }

  let watchId = null;
  if ('geolocation' in navigator) {
    watchId = navigator.geolocation.watchPosition(onLocationUpdate, onLocationError, {
      enableHighAccuracy: true,
      maximumAge: 5000,
      timeout: 10000
    });
  } else {
    onLocationError({ message: 'Geolocation not supported' });
  }

  document.getElementById('recenter-btn').addEventListener('click', () => {
    if (userMarker) map.setView(userMarker.getLatLng(), 15);
  });

  window.addEventListener('beforeunload', () => {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  });

  // ---- Filter chips ----
  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
  });

  // ---- Search filter ----
  document.getElementById('search-input').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.hosp-card').forEach(card => {
      const text = card.textContent.toLowerCase();
      card.style.display = text.includes(q) ? 'flex' : 'none';
    });
  });
</script>

</body>
</html>
