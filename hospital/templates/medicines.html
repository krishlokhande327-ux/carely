<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>medicines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Bootstrap+Icons&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
    .hero{
    margin:0 20px 20px;
    border-radius:22px;
    background:linear-gradient(135deg,var(--teal-700) 0%, var(--teal-500) 55%, var(--teal-300) 100%);
    padding:20px 0 0 20px;
    position:relative;
    overflow:hidden;
    min-height:190px;
    box-shadow:0 14px 30px rgba(14,107,100,0.35);
  }
  .hero-label{
    font-size:11px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.75);
    font-weight:600;
    margin-bottom:4px;
  }
  .hero h2{
    font-family:'Poppins',sans-serif;
    color:#fff;
    font-size:19px;
    line-height:1.3;
    font-weight:700;
    margin:0 0 10px;
    max-width:150px;
  }
  .hero ul{
    list-style:none;
    padding:0;
    margin:0 0 16px;
    font-size:12px;
    color:rgba(255,255,255,0.92);
    font-weight:500;
  }
  .hero ul li{
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .hero ul li i{font-size:11px;color:#ffe08a;}
  .hero-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#ffffff;
    color:var(--teal-700);
    font-weight:600;
    font-size:12.5px;
    padding:9px 16px;
    border-radius:20px;
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .hero-btn i{font-size:12px;}
  .hero-doctor{
    position:absolute;
    right:-6px;
    bottom:0;
    width:150px;
    object-fit:contain;
    object-position:bottom;
  }
</style>
</head>
<body>
     <div class="hero-nav">

                <div
                    class="hero-btn"
                    onclick="history.back()"
                >
                    <i class="bi bi-arrow-left"></i>
                </div>
    <h1>conming soon</h1>
</body>
</html>
